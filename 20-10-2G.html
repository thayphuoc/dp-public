<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20-10 2G Edu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pacifico', cursive;
            overflow: hidden; /* prevent scrolling */
            margin: 0;
        }

        .background-gradient {
            background: linear-gradient(135deg, #ffee58 0%, #fdd835 100%);
        }

     

        .text-gradient {
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-flow 5s ease infinite;
        }

    

        @keyframes text-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #hearts-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* under words */
        }
        
        .content-container {
            position: relative;
            z-index: 1; 
        }

      
        
        /* CSS for main */
        .greeting-text {
            font-size: clamp(2rem, 7vw, 4.5rem);
            line-height: 1.3;
            max-width: 90vw; /* not too wide */
        }
    </style>
</head>
<body class="background-gradient">

    <!-- falling hearts-->
    <canvas id="hearts-canvas"></canvas>

    <!-- Main-->
    <div class="content-container flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white/30 backdrop-blur-sm p-8 rounded-3xl shadow-lg text-center">
            <!-- -->
            <h1 class="text-gradient greeting-text">
                Chúc các tỷ muội 2G Education ngày 20-10 ngập tràn hạnh phúc và niềm vui!
            </h1>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('hearts-canvas');
        const ctx = canvas.getContext('2d');

        let hearts = [];
        const heartCount = 100;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // initiate a heart
        function initHearts() {
            hearts = [];
            for (let i = 0; i < heartCount; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 20 + 10,
                    speed: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.5 + 0.5,
                    color: `rgba(255, ${Math.random() * 100 + 100}, ${Math.random() * 100 + 150}, ${Math.random() * 0.5 + 0.5})`
                });
            }
        }

        // draw a heart
        function drawHeart(x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(x, y + topCurveHeight);
            // Top left curve
            ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
            // Bottom left curve
            ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
            // Bottom right curve
            ctx.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
            // Top right curve
            ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
            ctx.closePath();
            ctx.fill();
        }

        // Update heart shapes
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < hearts.length; i++) {
                let heart = hearts[i];
                heart.y += heart.speed;

                if (heart.y > canvas.height) {
                    heart.y = -heart.size;
                    heart.x = Math.random() * canvas.width;
                    heart.speed = Math.random() * 2 + 1;
                }

                drawHeart(heart.x, heart.y, heart.size, heart.color);
            }

            requestAnimationFrame(animate);
        }

        // resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            initHearts();
        });

        // start
        resizeCanvas();
        initHearts();
        animate();
    </script>
</body>
</html>
